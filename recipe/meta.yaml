{% set name = "reactivex" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/reactivex-{{ version }}.tar.gz
  sha256: 3b027c16e0476a2d3a81e8ee5780389cb16164b9e6eaae6a1df6ad796aa03a22

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >={{ python_min }},<4.0a0
    - typing-extensions >=4.1.1,<5.0.0a0

test:
  imports:
    - reactivex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://reactivex.io
  summary: ReactiveX (Rx) for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ruben-arts
    - hmaarrfk
