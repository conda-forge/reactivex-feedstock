{% set name = "reactivex" %}
{% set version = "5.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/reactivex-{{ version }}.tar.gz
  sha256: b6b40269ebcbf24c53455c1b6790d682122cc8c01c907b8c8da47e2babb3b77e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }},<4.0a0
    - typing-extensions >=4.15.0,<5.0.0a0

test:
  imports:
    - reactivex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://reactivex.io
  summary: ReactiveX (Rx) for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ruben-arts
    - hmaarrfk
