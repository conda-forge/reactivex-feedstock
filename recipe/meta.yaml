{% set version = "6.1.0" %}

package:
  name: reactivex
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/reactivex/reactivex-{{ version }}.tar.gz
  sha256: 09c856a3d727a08331e891d4af360b8a0069f34391957f21e417e62ffe81518c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }},<4.0a0
    - typing-extensions >=4.15.0,<5.0.0a0

test:
  imports:
    - reactivex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://reactivex.io
  summary: ReactiveX (Rx) for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ruben-arts
    - hmaarrfk
